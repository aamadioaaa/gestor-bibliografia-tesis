    <script type="text/javascript">
        window.cheqRequestId = null;
        window.__resolveCheq = null;

        window.onCheqResponse = function (data, requestId) {
            if (typeof requestId === "string" && requestId.length > 0) {
                window.cheqRequestId = requestId;
            }

            if (typeof window.__resolveCheq === "function") {
                window.__resolveCheq();

    <script async

    <script type="text/javascript">
        const REDIRECT_URL = 'http://libgen.lc/scimag/?q=10.1103/PhysRevLett.88.174102&tr_uuid=20260701-0120-231d-8bff-e36d06dfd9de&';
        const TIMEOUT_MS = 2500;

        let redirected = false;

        const payload = {
            fp: '-7',
            cheq: null,
        };

        const buildQuery = () =>
            Object.entries(payload)
                .filter(([, v]) => typeof v === 'string' && v.length > 0)
                .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
                .join('&');

        const redirect = () => {
            if (redirected) return;
            redirected = true;

            if (typeof window.cheqRequestId === "string" && window.cheqRequestId.length > 0) {
                payload.cheq = window.cheqRequestId;
            }

            const qs = buildQuery();
            const url = qs ? REDIRECT_URL + qs : REDIRECT_URL;
            window.location.replace(url);
        };

        const timeout = setTimeout(redirect, TIMEOUT_MS);

        const cheqPromise = new Promise(resolve => {
            window.__resolveCheq = resolve;

            if (window.cheqRequestId !== null) {
                resolve();
            }
        });

        const promises = [];

        if (window.cheqRequestId === null) {
            promises.push(cheqPromise);
        }

        Promise.allSettled(promises).then(() => {
            clearTimeout(timeout);
            redirect();
        });
    </script>
